<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Dashboard | Forensic System</title>

  <style>

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --slate-950: #f4f6f9;
      --slate-900: #ffffff;
      --slate-850: #f8fafc;
      --slate-800: #edf2f7;
      --slate-750: #e2e8f0;
      --slate-700: #cbd5e1;
      --slate-400: #64748b;
      --slate-300: #475569;
      --slate-200: #334155;
      --slate-100: #1e293b;
      --slate-50: #0f172a;

      --accent: #2563eb;
      --accent-dim:#1d4ed8;

      --amber:#d97706;
      --amber-light:#b45309;

      --teal:#0d9488;

      --danger:#e11d48;

      --border: rgba(0,0,0,0.05);
      --border-mid: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.14);
    }

    html, body {
      height:100%;
    }

    body{
      background:var(--slate-950);
      display:flex;
      min-height:100vh;
      font-family:'Segoe UI',sans-serif;
      color:var(--slate-100);
    }

    /* SIDEBAR */

    .sidebar{
      width:248px;
      background:var(--slate-900);
      border-right:1px solid var(--border-mid);
      display:flex;
      flex-direction:column;
      height:100vh;
      position:sticky;
      top:0;
    }

    .sidebar-head{
      padding:28px 24px 20px;
      border-bottom:1px solid var(--border-mid);
    }

    .logo-row{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo-icon{
      width:32px;
      height:32px;
      border-radius:8px;
      background:var(--slate-850);
      border:1px solid var(--border-mid);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo-name{
      font-size:15px;
      font-weight:700;
    }

    .logo-sub{
      font-size:10px;
      color:var(--slate-400);
      margin-left:42px;
      margin-top:4px;
      text-transform:uppercase;
      letter-spacing:0.1em;
    }

    .sidebar-section{
      padding:18px 14px;
      flex:1;
    }

    .section-label{
      font-size:10px;
      color:var(--slate-400);
      margin-bottom:8px;
      padding:0 8px;
      text-transform:uppercase;
      letter-spacing:0.1em;
      font-weight:700;
    }

    .menu-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:transparent;
      color:var(--slate-300);
      cursor:pointer;
      margin-bottom:5px;
      text-align:left;
      font-size:14px;
      transition:0.2s;
    }

    .menu-btn:hover{
      background:var(--slate-850);
    }

    .menu-btn.active{
      background:var(--slate-800);
      color:var(--slate-100);
      border:1px solid var(--border-mid);
    }

    .sidebar-footer{
      padding:14px;
      border-top:1px solid var(--border-mid);
    }

    .logout-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:rgba(225,29,72,0.08);
      color:var(--danger);
      cursor:pointer;
      font-weight:600;
    }

    /* MAIN */

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .topbar{
      background:white;
      border-bottom:1px solid var(--border-mid);
      padding:20px 32px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .topbar h1{
      font-size:20px;
    }

    .topbar p{
      font-size:12px;
      color:var(--slate-400);
      margin-top:2px;
    }

    .topbar-badge{
      background:rgba(13,148,136,0.08);
      color:var(--teal);
      border:1px solid rgba(13,148,136,0.2);
      border-radius:6px;
      padding:6px 12px;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
    }

    .content{
      flex:1;
      overflow-y:auto;
      padding:28px 32px;
    }

    .view{
      display:none;
    }

    .view.active{
      display:block;
    }

    /* DASHBOARD */

    .welcome-banner{
      background:white;
      border:1px solid var(--border-mid);
      border-radius:14px;
      padding:28px;
      margin-bottom:24px;
    }

    .welcome-banner h2{
      margin-bottom:10px;
    }

    .welcome-banner p{
      line-height:1.7;
      color:var(--slate-300);
      font-size:14px;
    }

    .stats-row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:14px;
      margin-bottom:24px;
    }

    .stat-card{
      background:white;
      border:1px solid var(--border-mid);
      border-radius:12px;
      padding:20px;
    }

    .stat-label{
      font-size:11px;
      color:var(--slate-400);
      text-transform:uppercase;
      letter-spacing:0.08em;
      margin-bottom:8px;
      font-weight:700;
    }

    .stat-value{
      font-size:28px;
      font-weight:700;
      color:var(--accent);
    }

    /* CASES */

    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .section-header h2{
      font-size:16px;
    }

    .count-badge{
      background:var(--slate-800);
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
    }

    .case-card{
      background:white;
      border:1px solid var(--border-mid);
      border-radius:14px;
      padding:24px;
      margin-bottom:16px;
    }

    .case-card-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .case-id{
      font-size:16px;
      font-weight:700;
    }

    .status-pill{
      background:rgba(37,99,235,0.08);
      color:var(--accent);
      border:1px solid rgba(37,99,235,0.2);
      padding:5px 10px;
      border-radius:6px;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
    }

    .field-label{
      font-size:11px;
      font-weight:700;
      color:var(--slate-400);
      text-transform:uppercase;
      margin-bottom:8px;
      letter-spacing:0.08em;
    }

    .readonly-box{
      background:var(--slate-850);
      border:1px solid var(--border-mid);
      border-radius:10px;
      padding:14px;
      line-height:1.7;
      font-size:14px;
      margin-bottom:18px;
    }

    textarea{
      width:100%;
      min-height:120px;
      resize:vertical;
      border:1px solid var(--border-mid);
      background:var(--slate-800);
      border-radius:10px;
      padding:14px;
      font-size:14px;
      margin-bottom:20px;
      outline:none;
    }

    textarea:focus{
      border-color:var(--accent);
      background:white;
    }

    .save-btn{
      background:var(--accent);
      color:white;
      border:none;
      border-radius:10px;
      padding:12px 22px;
      cursor:pointer;
      font-weight:600;
      font-size:14px;
    }

    .save-btn:hover{
      background:var(--accent-dim);
    }

    .empty-state{
      background:white;
      border:1px dashed var(--border-strong);
      border-radius:14px;
      padding:50px;
      text-align:center;
      color:var(--slate-400);
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="sidebar-head">

    <div class="logo-row">

      <div class="logo-icon">⚗️</div>

      <div class="logo-name">
        ForenSys
      </div>

    </div>

    <div class="logo-sub">
      Lab Module
    </div>

  </div>


  <div class="sidebar-section">

    <div class="section-label">
      Navigation
    </div>

    <button
      class="menu-btn active"
      onclick="showView('dashboardView',this)"
    >
      Dashboard
    </button>

    <button
      class="menu-btn"
      onclick="showView('casesView',this)"
    >
      Ongoing Cases
    </button>

  </div>


  <div class="sidebar-footer">

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>





<!-- MAIN -->

<div class="main">

  <div class="topbar">

    <div>

      <h1>Lab Dashboard</h1>

      <p>Forensic Case Management System</p>

    </div>

    <div class="topbar-badge">
      Lab Officer
    </div>

  </div>



  <div class="content">



    <!-- DASHBOARD -->

    <div
      id="dashboardView"
      class="view active"
    >

      <div class="welcome-banner">

        <h2>Welcome, Lab Officer</h2>

        <p>
          Review police evidence descriptions and submit forensic analysis reports securely back to police dashboard.
        </p>

      </div>


      <div class="stats-row">

        <div class="stat-card">

          <div class="stat-label">
            Active Cases
          </div>

          <div
            class="stat-value"
            id="statTotal"
          >
            —
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            Pending Reports
          </div>

          <div
            class="stat-value"
            id="statPending"
          >
            —
          </div>

        </div>

      </div>

    </div>




    <!-- CASES VIEW -->

    <div
      id="casesView"
      class="view"
    >

      <div class="section-header">

        <h2>Ongoing Cases</h2>

        <span
          class="count-badge"
          id="caseCount"
        >
          Loading...
        </span>

      </div>


      <div id="casesContainer"></div>

    </div>



  </div>

</div>






<script>

const API = "http://localhost:5000/api";

const token = localStorage.getItem("token");

let casesCache = [];


/* LOGIN CHECK */

if(!token){

  window.location = "auth.html";

}



/* LOGOUT */

function logout(){

  localStorage.clear();

  window.location = "auth.html";

}



/* VIEW SWITCH */

function showView(id,btn){

  document
    .querySelectorAll(".view")
    .forEach(v => v.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll(".menu-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

}



/* LOAD CASES */

async function loadCases(){

  try{

    const response = await fetch(`${API}/cases`,{

      headers:{
        Authorization: token
      }

    });


    const allCases = await response.json();


    /* ONLY ONGOING CASES */

    casesCache = allCases.filter(c => {

      if(!c.status) return true;

      return c.status.toLowerCase() !== "completed";

    });


    document.getElementById("caseCount").textContent =
      `${casesCache.length} ongoing cases`;

    document.getElementById("statTotal").textContent =
      casesCache.length;


    const pending =
      casesCache.filter(c =>
        !c.labReport || c.labReport.trim() === ""
      ).length;


    document.getElementById("statPending").textContent =
      pending;


    const container =
      document.getElementById("casesContainer");

    container.innerHTML = "";


    if(casesCache.length === 0){

      container.innerHTML = `
        <div class="empty-state">
          No ongoing cases available.
        </div>
      `;

      return;
    }



    casesCache.forEach(c => {

      container.innerHTML += `

        <div class="case-card">

          <div class="case-card-header">

            <div class="case-id">
              ${c.caseId}
            </div>

            <div class="status-pill">
              ${c.status}
            </div>

          </div>



          <div class="field-label">
            Evidence Type
          </div>

          <div class="readonly-box">
            ${c.evidenceType || "Not Available"}
          </div>



          <div class="field-label">
            Police Description
          </div>

          <div class="readonly-box">
            ${c.policeDescription || "No description available"}
          </div>



          <div class="field-label">
            Lab Report
          </div>

          <textarea
            id="report-${c._id}"
            placeholder="Enter forensic analysis report..."
          >${c.labReport || ""}</textarea>



          <button
            class="save-btn"
            onclick="updateCase('${c._id}')"
          >
            Save Report
          </button>

        </div>

      `;

    });

  }

  catch(error){

    console.error(error);

  }

}



/* UPDATE CASE */

async function updateCase(id){

  const report =
    document.getElementById(`report-${id}`).value;


  try{

    const response = await fetch(`${API}/cases/${id}`,{

      method:"PUT",

      headers:{
        "Content-Type":"application/json",
        "Authorization": token
      },

      body:JSON.stringify({

        labReport: report,

        evidenceIdentification:"Processed by Lab"

      })

    });


    const data = await response.json();

    console.log(data);


    if(response.ok){

      alert("Lab Report Updated Successfully");

      loadCases();

    }

    else{

      alert(data.message || "Update Failed");

    }

  }

  catch(error){

    console.error(error);

    alert("Server Error");

  }

}



/* INITIAL LOAD */

loadCases();

</script>

</body>
</html>
