<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensic System | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #121212;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #ffffff;
        }

        body { 
            background: var(--bg); 
            color: var(--text-primary); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-box { 
            background: var(--card-bg); 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 380px; 
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 1px rgba(255,255,255,0.1);
        }

        h2 { 
            font-size: 16px;
            letter-spacing: 5px; 
            font-weight: 900;
            margin-bottom: 40px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        input { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 16px; 
            margin-bottom: 20px; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 13px; 
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input:focus { 
            border-color: #666; 
            outline: none; 
            background: #1f1f1f; 
        }

        button { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 18px; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            width: 100%; 
            font-size: 12px; 
            letter-spacing: 2px; 
            border-radius: 8px;
            transition: 0.2s; 
            margin-top: 10px;
        }

        button:hover { 
            background: #e0e0e0; 
            transform: translateY(-1px);
        }

        .footer-links { 
            margin-top: 30px; 
            font-size: 11px; 
            color: var(--text-secondary); 
            letter-spacing: 1px;
        }

        .footer-links a { 
            color: var(--text-primary); 
            text-decoration: none; 
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
            transition: 0.2s;
        }

        .footer-links a:hover {
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>FORENSIC LOGIN</h2>
        
        <input type="email" id="email" placeholder="ACCESS EMAIL">
        <input type="password" id="password" placeholder="SECURE PASSWORD">
        
        <button onclick="login()">LOGIN</button>

        <div class="footer-links">
            NEW TO THE SYSTEM? 
            <br>
            <a href="register.html">CREATE ACCOUNT</a>
        </div>
    </div>

    <script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) return alert("Please enter credentials");

        try {
            const res = await fetch('http://localhost:5000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            
            if (res.ok && data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                
                // Successful Auth Animation/Redirect
                window.location.href = data.role === 'police' ? 'police.html' : 'lab.html';
            } else {
                alert(data.msg || "Access Denied");
            }
        } catch (err) {
            console.error("Login error:", err);
            alert("Terminal connection failed");
        }
    }
    </script>
</body>
</html>
